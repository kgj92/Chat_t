<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="미국주식 실시간 채팅">
<link rel="stylesheet" href="style.css">
<title>STOCK24</title>
</head>

<body>
<header>
  <button id="menuBtn" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
  <div class="logo"><span>🇺🇸</span>STOCK24</div>
  <button id="loginBtn">로그인</button>
</header>

<div id="menuOverlay"></div>
<nav id="sideMenu">
  <div class="menuTitle">STOCK24</div>
  <button class="menuItem">커뮤니티 정책</button>
  <button class="menuItem">Q&A</button>
</nav>

<main>
  <section id="homeView">
    <div class="searchWrap">
      <div class="searchBox">
        <!--<span class="searchIcon">⌕</span>-->
        <input id="stockSearch" placeholder="종목명 검색" autocomplete="off">
        <span class="searchIcon">⌕</span>
      </div>
    </div>

   <div class="listHeader">
      <div class="listTitle">실시간 인기 종목</div>
      <select id="sortSelect">
        <option value="people">사람 많은 순</option>
        <option value="volume">거래량 순</option>
        <option value="up">급등 순</option>
        <option value="down">급락 순</option>
      </select>
    </div>

    <div id="stockList" class="stockList"></div>
    
  </section>

  <section id="roomView">
    <div class="roomHeader">
      <button id="backBtn">‹</button>
      <div class="roomInfo">
        <div class="roomTop"><span id="roomTicker" class="roomTicker"></span><span id="roomName" class="roomName"></span></div>
        <div><span id="roomPrice" class="roomPrice"></span></div>
      </div>
      <div id="roomPeople" class="roomPeople">👥 0</div>
    </div>

    <div class="chartBox"><canvas id="chartCanvas"></canvas></div>
    <div id="roomChat"></div>

    <div id="stickerBox">
      <img src="stickers/1.png" onclick="sendSticker('stickers/1.png')">
      <img src="stickers/2.png" onclick="sendSticker('stickers/2.png')">
      <img src="stickers/3.png" onclick="sendSticker('stickers/3.png')">
      <img src="stickers/4.png" onclick="sendSticker('stickers/4.png')">
    </div>

    <div id="inputBox">
      <button id="emojiBtn">😀</button>
      <input id="message" placeholder="메시지를 입력하세요..." maxlength="500">
      <input type="file" id="imageInput" accept="image/*">
      <button id="imageSelectBtn" title="사진">📷</button>
      <button id="sendBtn">전송</button>
    </div>
  </section>
</main>

<div id="loginModal" class="loginModal">
  <div class="modal">
    <h2>닉네임 설정</h2>
    <p>로그인 없이 익명으로 이용할 수 있습니다.<br>채팅에 표시될 닉네임만 정해주세요.</p>
    <input id="nickname" maxlength="20" placeholder="예: 미주갤럼">
    <div class="modalActions">
      <button class="cancel" id="cancelLogin">취소</button>
      <button class="confirm" id="confirmLogin">저장</button>
    </div>
  </div>
</div>

<script src="https://chat-iey5.onrender.com/socket.io/socket.io.js"></script>
<script src="script.js"></script>
<!-- =========================================================
   STOCK24 MVP
   - 기존 채팅24 Socket.IO 서버를 그대로 사용
   - 실제 시세 API가 없을 때도 화면을 확인할 수 있도록 샘플 시세 제공
   - 서버에서 "stock chat room" 기능을 추가하면 stockRoom 이벤트로 확장 가능
========================================================= */
-->

</body>
</html>
